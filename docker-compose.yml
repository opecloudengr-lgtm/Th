services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventpass
      POSTGRES_PASSWORD: eventpass
      POSTGRES_DB: eventpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Copy backend/.env.example to backend/.env and fill in real secrets
    # (Paystack keys, SMTP, SECRET_KEY) for anything beyond local testing.
    # Safe to omit for a first local run -- payments/email just degrade
    # gracefully (see backend/README or the root README).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://eventpass:eventpass@postgres:5432/eventpass
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Server-side only: the Next.js server proxies /api/* here. This is
      # Docker Compose's internal DNS name for the backend service -- it
      # works the same whether you open the site at localhost:3000, a
      # GitHub Codespaces forwarded URL, or a real domain, because the
      # browser never talks to this address directly (see next.config.ts).
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
